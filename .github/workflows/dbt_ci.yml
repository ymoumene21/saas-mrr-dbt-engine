# This workflow runs automatically every time code is pushed to the main branch.
name: dbt CI Pipeline

on:
  push:
    branches: [main]   # trigger only on pushes to the main branch

jobs:
  dbt-test:
    runs-on: ubuntu-latest   # spin up a fresh temporary Linux machine

    steps:
      # Step 1: pull your repo's code onto that temporary machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: install Python, since dbt is a Python-based CLI tool
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: install dbt with the Snowflake adapter
      - name: Install dbt
        run: pip install dbt-snowflake

      # Step 4: dynamically write profiles.yml using GitHub Secrets
      # (this file never touches your actual repo — it's created fresh, in-memory, on the runner)
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat <<'EOF' > ~/.dbt/profiles.yml
          saas_analytics:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                password: "${{ secrets.SNOWFLAKE_PASSWORD }}"
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: SAAS_PROD
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: dbt_dev
                threads: 4
          EOF

      # Step 5: install any dbt packages your project depends on
      - name: Install dbt dependencies
        run: dbt deps

      # Step 6: build all models fresh on the CI runner
      - name: dbt run
        run: dbt run

      # Step 7: the actual quality gate — run all schema tests from Day 9
      - name: dbt test
        run: dbt test
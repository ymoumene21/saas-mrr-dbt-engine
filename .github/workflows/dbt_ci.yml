name: dbt CI Pipeline

on:
  push:
    branches: [main]

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code          # CSVs + profiles.yml come with the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt with the DuckDB adapter
        run: pip install dbt-duckdb

      # dbt build = snapshot + run + test, in dependency order.
      # Needed because CI starts with an EMPTY database every time.
      - name: Build and test the whole pipeline
        run: dbt build
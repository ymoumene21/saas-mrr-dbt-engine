version: 2

sources:
  - name: stripe
    description: "Raw Stripe exports, stored as CSV files in data/raw/"
    config:
      # dbt-duckdb reads these files directly.
      # {name} is swapped for each table name below, e.g. data/raw/raw_users.csv
      external_location: "data/raw/{name}.csv"
    tables:
      - name: raw_subscriptions
      - name: raw_users

 
